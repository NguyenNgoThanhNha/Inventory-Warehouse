# Production trên một máy chủ (VPS): dùng image đã build sẵn ở GHCR (xem .github/workflows/cd.yml).
#   cp .env.example .env   # sửa mật khẩu, JWT_KEY, domain
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# HTTPS: đặt reverse proxy có TLS (Caddy / Nginx / Cloudflare Tunnel) trỏ vào cổng WEB_PORT.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Đặt SA_PASSWORD trong .env}"
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    image: "${IMAGE_PREFIX:-ghcr.io/OWNER/inventory}-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=InventoryDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "${JWT_KEY:?Đặt JWT_KEY (>= 32 ký tự) trong .env}"
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "${SEED_DEMO_DATA:-false}"
      Cors__Origins__0: "${PUBLIC_URL:?Đặt PUBLIC_URL, vd https://kho.example.com}"
      App__FrontendBaseUrl: "${PUBLIC_URL}"
      ForwardedHeaders__Enabled: "true"

  web:
    image: "${IMAGE_PREFIX:-ghcr.io/OWNER/inventory}-web:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  sqldata:
